[General]
; Valid levels: Trace, Debug, Info, Warn, Err, Critical, Off.
; Debug includes detailed quest-door destination diagnostics.
LogLevel=Info

[Behavior]
; Settings are read at game startup. False delegates that marker type to vanilla.
; Discovered locations and native dragon cruising retain their original behavior.
AllowCustomDestination=true

; Quest targets that the game displays directly, usually outdoor objectives.
AllowDirectQuestMarkers=false

; EXPERIMENTAL: targets displayed through a teleport door or the native routing fallback.
; Travel to a door's reference origin can leave you stuck inside its collision.
; Use the console command tcl to move out, then tcl again to restore collision.
; Correct door arrival placement is deferred to a later release.
AllowDoorQuestMarkers=false

AllowUndiscoveredLocations=false
