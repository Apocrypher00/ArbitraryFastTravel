; Restart Skyrim after changing any setting.

[General]
; Controls plugin log verbosity.
; Valid levels: Trace, Debug, Info, Warn, Err, Critical, Off.
LogLevel=Info

[Behavior]
; Allows fast travel to the custom destination you place on the map.
; False leaves custom destination selection to vanilla, including native dragon cruising.
AllowCustomDestination=true

; Allows fast travel to quest targets displayed directly, usually outdoor objectives.
; False leaves these quest markers to vanilla.
AllowDirectQuestMarkers=false

; EXPERIMENTAL: allows fast travel to quest targets pointing at interiors.
; Arrival at a door can leave you stuck inside its collision. False leaves these quest markers to vanilla.
; If stuck, use the console command tcl to move clear, then tcl again to restore collision.
AllowDoorQuestMarkers=false

; Allows fast travel to undiscovered location markers.
; False leaves undiscovered locations to vanilla. Discovered locations always retain vanilla behavior.
AllowUndiscoveredLocations=false
